<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #D8F3DC;
            font-family: 'Roboto Slab', serif, system-ui;
            color: #343A40;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .left-col {
            width: 680px;
            padding-top: 100px;
            padding-left: 90px;
        }
        .badge {
            display: inline-block;
            background: #001D3D;
            color: #D8F3DC;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 4px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #D90429;
            margin-bottom: 24px;
        }
        .title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 52px;
            line-height: 1.05;
            color: #001D3D;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
        }
        .subtitle {
            font-size: 22px;
            color: #1B4332;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 36px;
            border-left: 6px solid #D90429;
            padding-left: 18px;
        }
        .meta-box {
            display: flex;
            gap: 28px;
            font-size: 14px;
            color: #495057;
            font-weight: 600;
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .right-col {
            width: 440px;
            padding-top: 100px;
            padding-right: 90px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #FFFFFF;
            border: 3px solid #001D3D;
            box-shadow: 8px 8px 0px #001D3D;
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .logo-img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            margin-bottom: 16px;
        }
        .card-tag {
            font-family: 'Impact', sans-serif;
            font-size: 18px;
            color: #001D3D;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="left-col">
            <div class="badge">Engineering Stakeholder Review</div>
            <h1 class="title">Release Blockers:<br>Implementation Plan</h1>
            <p class="subtitle">Resolving desktop converter availability and Android conversion state feedback for release readiness.</p>
            <div class="meta-box">
                <div class="meta-item"><i class="fa-solid fa-code-branch" style="color: #D90429;"></i> Revision 5f71d40</div>
                <div class="meta-item"><i class="fa-solid fa-layer-group" style="color: #001D3D;"></i> Scope: P0 Usability Defects</div>
                <div class="meta-item"><i class="fa-solid fa-shield-halved" style="color: #2D6A4F;"></i> Zero Core Regression</div>
            </div>
        </div>
        <div class="right-col">
            <div class="card">
                <img src="/home/ubuntu/Watermelon-VectorConverter/android/app/src/main/res/drawable/watermelon_splash.png" alt="App Logo" class="logo-img" />
                <div class="card-tag">WATERMELON VECTOR CONVERTER</div>
            </div>
        </div>
    </div>
</body>
</html>
