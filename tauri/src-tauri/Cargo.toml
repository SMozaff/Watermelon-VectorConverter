[package]
name = "wvgc-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Suhail Muzaffari <so.muzaff@gmail.com>"]
license = "LicenseRef-Proprietary"

[lib]
name = "wvgc_desktop"
path = "src/lib.rs"

[[bin]]
name = "wvgc-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = "2"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
svg-converter-core = { path = "../../svg-converter-core" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# core-foundation is a mature, complete crate used only for safe CFString
# construction/lifetime management. LSSetDefaultRoleHandlerForContentType
# itself is called via a direct, hand-written extern "C" FFI declaration
# below (in commands.rs) rather than a Launch-Services binding crate, since
# the one available crate for that (core-services) documents itself as
# "woefully incomplete" and isn't worth trusting for a function this
# specific without being able to verify it on a real Mac first.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
