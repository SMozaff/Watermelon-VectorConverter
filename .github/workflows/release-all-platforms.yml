name: Build All Platforms

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }} release package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
          - name: Debian Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libxkbcommon-dev \
            libglib2.0-dev \
            pkg-config

      - name: Build wvgc-desktop and wvgc-cli (release)
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(cargo pkgid -p wvgc-desktop | sed 's/.*[#@]//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y --no-progress

      - name: Install cargo-wix
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --locked

      - name: Build MSI installer
        if: runner.os == 'Windows'
        run: cargo wix -p wvgc-desktop --nocapture --target ${{ matrix.target }}
        env:
          WATERMELON_ICON_ICO: ${{ github.workspace }}\icons\watermelon.ico
          WATERMELON_ICON_SVG_ICO: ${{ github.workspace }}\icons\watermelon_svg.ico
          WATERMELON_ICON_XML_ICO: ${{ github.workspace }}\icons\watermelon_xml.ico

      - name: Rename MSI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          find target/wix -name "*.msi" -exec mv {} "dist/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_x64.msi" \;

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: runner.os == 'Linux'
        run: cargo deb -p wvgc-desktop --target ${{ matrix.target }} --no-build --no-strip

      - name: Rename .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          find target/debian -name "*.deb" -exec mv {} "dist/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_amd64.deb" \;

      - name: Build .app bundle and .pkg installer
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="dist/Watermelon Vector Converter.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/wvgc-desktop" "$APP/Contents/MacOS/wvgc-desktop"
          cp "target/${{ matrix.target }}/release/wvgc-cli" "$APP/Contents/MacOS/wvgc-cli"
          cp icons/watermelon.icns "$APP/Contents/Resources/watermelon.icns"
          sed "s/__VERSION__/${{ steps.version.outputs.version }}/g" desktop/macos/Info.plist > "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/wvgc-desktop" "$APP/Contents/MacOS/wvgc-cli"
          pkgbuild \
            --component "$APP" \
            --install-location /Applications \
            --identifier com.watermelon.vectorconverter \
            --version "${{ steps.version.outputs.version }}" \
            "dist/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_${{ matrix.target }}.pkg"

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-vector-converter-${{ matrix.target }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android universal APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Rust core for all Android ABIs
        working-directory: svg-converter-core
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -t x86 \
            -o ../android/app/src/main/jniLibs \
            build --release

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > "$GITHUB_WORKSPACE/digital_raven_release.jks"

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/digital_raven_release.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Get Android version
        id: version
        run: |
          VERSION=$(grep versionName android/app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_Android.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-vector-converter-android-${{ github.run_number }}
          path: dist/Watermelon_vector_converter_v*.apk
          if-no-files-found: error
          retention-days: 30
