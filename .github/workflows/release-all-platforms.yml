---
name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: all-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.name }} release package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
          - name: Debian Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libxkbcommon-dev \
            libglib2.0-dev \
            pkg-config

      - name: Build wvgc-desktop and wvgc-cli (release)
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(cargo pkgid -p wvgc-desktop | sed 's/.*[#@]//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # --- Windows: single MSI installer (wvgc-desktop.exe + wvgc-cli.exe) ---
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y --no-progress

      - name: Install cargo-wix
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --locked

      - name: Build MSI installer
        if: runner.os == 'Windows'
        run: cargo wix -p wvgc-desktop --nocapture --target ${{ matrix.target }}
        env:
          WATERMELON_ICON_ICO: ${{ github.workspace }}\icons\watermelon.ico

      - name: Rename MSI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          find target/wix -name "*.msi" -exec mv {} "dist/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_x64.msi" \;

      # --- Debian: single .deb (wvgc-desktop + wvgc-cli) ---
      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: runner.os == 'Linux'
        run: cargo deb -p wvgc-desktop --target ${{ matrix.target }} --no-build --no-strip

      - name: Rename .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          find target/debian -name "*.deb" -exec mv {} "dist/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_amd64.deb" \;

      # --- macOS: single .pkg installer (app bundle with both binaries) ---
      - name: Build .app bundle and .pkg installer
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="dist/Watermelon Vector Converter.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/wvgc-desktop" "$APP/Contents/MacOS/wvgc-desktop"
          cp "target/${{ matrix.target }}/release/wvgc-cli" "$APP/Contents/MacOS/wvgc-cli"
          cp icons/watermelon.icns "$APP/Contents/Resources/watermelon.icns"
          sed "s/__VERSION__/${{ steps.version.outputs.version }}/g" desktop/macos/Info.plist > "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/wvgc-desktop" "$APP/Contents/MacOS/wvgc-cli"
          pkgbuild \
            --component "$APP" \
            --install-location /Applications \
            --identifier com.watermelon.vectorconverter \
            --version "${{ steps.version.outputs.version }}" \
            "dist/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_${{ matrix.target }}.pkg"

      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-vector-converter-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
