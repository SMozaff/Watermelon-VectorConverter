name: desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: Debian
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            label: macOS
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        # Pinned to match rust-toolchain.toml exactly (not @stable): rustup
        # resolves the toolchain to use by name, and rust-toolchain.toml's
        # channel = "1.97.1" activates a toolchain named "1.97.1-<host>" —
        # a different rustup toolchain identity than "stable-<host>". Cross
        # targets added to "stable" here would not exist under "1.97.1",
        # which is what cargo actually picks up, causing
        # "error[E0463]: can't find crate for `std`" on any --target that
        # isn't the runner's native host.
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libxkbcommon-dev \
            libglib2.0-dev \
            pkg-config

      - name: Build wvgc-desktop and wvgc-cli (release)
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(cargo pkgid -p wvgc-desktop | sed 's/.*[#@]//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # --- Windows: single MSI installer (wvgc-desktop.exe + wvgc-cli.exe) ---
      - name: Install WiX Toolset
        if: matrix.os == 'windows-latest'
        run: choco install wixtoolset -y --no-progress

      - name: Install cargo-wix
        if: matrix.os == 'windows-latest'
        run: cargo install cargo-wix --locked

      - name: Build MSI installer
        if: matrix.os == 'windows-latest'
        run: cargo wix -p wvgc-desktop --nocapture --target ${{ matrix.target }}
        env:
          WATERMELON_ICON_ICO: ${{ github.workspace }}\icons\watermelon.ico

      - name: Rename MSI
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          find target/wix -name "*.msi" -exec mv {} "dist/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_x64.msi" \;

      # --- Debian: single .deb (wvgc-desktop + wvgc-cli) ---
      - name: Install cargo-deb
        if: matrix.os == 'ubuntu-22.04'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: matrix.os == 'ubuntu-22.04'
        run: cargo deb -p wvgc-desktop --target ${{ matrix.target }} --no-build --no-strip

      - name: Rename .deb
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p dist
          find target/debian -name "*.deb" -exec mv {} "dist/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_amd64.deb" \;

      # --- macOS: single .pkg installer (app bundle with both binaries) ---
      - name: Build .app bundle and .pkg installer
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          APP="dist/Watermelon Vector Converter.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/wvgc-desktop" "$APP/Contents/MacOS/wvgc-desktop"
          cp "target/${{ matrix.target }}/release/wvgc-cli" "$APP/Contents/MacOS/wvgc-cli"
          cp icons/watermelon.icns "$APP/Contents/Resources/watermelon.icns"
          sed "s/__VERSION__/${{ steps.version.outputs.version }}/g" desktop/macos/Info.plist > "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/wvgc-desktop" "$APP/Contents/MacOS/wvgc-cli"
          pkgbuild \
            --component "$APP" \
            --install-location /Applications \
            --identifier com.watermelon.vectorconverter \
            --version "${{ steps.version.outputs.version }}" \
            "dist/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_macos.pkg"

      - name: List installer outputs
        if: always()
        shell: bash
        run: find dist -maxdepth 1 -type f 2>/dev/null | sort || true

      - name: Upload installer artifact (always, no release/tag)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}-${{ matrix.label }}
          name: "Watermelon Vector Converter ${{ steps.version.outputs.version }} Desktop (${{ matrix.label }})"
          body: |
            ## Watermelon Vector Converter Desktop (${{ matrix.label }})

            One installer, everything included:
            - Converter GUI
            - File viewer (opens automatically when launched with a file path)
            - wvgc-cli command-line tool

            All three share the same Rust conversion core.
          files: dist/*
          fail_on_unmatched_files: true
