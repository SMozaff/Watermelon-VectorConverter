name: desktop

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            label: macOS
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # iced's default renderer needs a graphics backend; on Linux CI
      # runners (no GPU) this also needs the usual X11/Wayland dev headers
      # for windowing, plus rfd's file-dialog backend dependencies.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('desktop/Cargo.toml','rb'))['package']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        working-directory: desktop
        run: cargo build --release --target ${{ matrix.target }}

      # ── Windows: real .msi via cargo-wix (WiX Toolset) ──────────────────
      - name: Install cargo-wix
        if: matrix.os == 'windows-latest'
        run: cargo install cargo-wix --locked

      - name: Generate WiX installer source (first run only)
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        shell: bash
        run: |
          if [ ! -f wix/main.wxs ]; then
            cargo wix init
          fi

      - name: Build MSI installer
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        run: cargo wix --target ${{ matrix.target }} --nocapture

      - name: Rename MSI
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          find desktop/target/wix -name "*.msi" | while read f; do
            mv "$f" "desktop/target/wix/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_$(basename "$f")"
          done

      - name: Upload Windows artifact (always, no release/tag)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-Windows-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: desktop/target/wix/*.msi
          if-no-files-found: warn
          retention-days: 14

      # ── Linux: real .deb via cargo-deb ──────────────────────────────────
      - name: Install cargo-deb
        if: matrix.os == 'ubuntu-22.04'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: matrix.os == 'ubuntu-22.04'
        working-directory: desktop
        run: cargo deb --target ${{ matrix.target }} --no-build

      - name: Rename .deb
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          find desktop/target/debian -name "*.deb" | while read f; do
            mv "$f" "desktop/target/debian/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_$(basename "$f")"
          done

      - name: Upload Linux artifact (always, no release/tag)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-Linux-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: desktop/target/debian/*.deb
          if-no-files-found: warn
          retention-days: 14

      # ── macOS: plain binary for now (no installer tooling configured yet) ─
      - name: Package macOS binary
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p desktop/target/package
          cp desktop/target/${{ matrix.target }}/release/wvgc-desktop \
             "desktop/target/package/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_macos"
          chmod +x "desktop/target/package/Watermelon_vector_converter_v${{ steps.version.outputs.version }}_macos"

      - name: Upload macOS artifact (always, no release/tag)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macOS-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: desktop/target/package/*
          if-no-files-found: warn
          retention-days: 14

      # ── Tagged releases, per-OS (unchanged trigger/behavior from before) ─
      - name: Upload release (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}-${{ matrix.label }}
          name: "Watermelon Vector Converter ${{ steps.version.outputs.version }} Desktop (${{ matrix.label }})"
          body: |
            ## Watermelon Vector Converter Desktop (${{ matrix.label }})

            Native build — no WebView2/Tauri dependency. Includes both the
            converter and the viewer (opened automatically via file
            association for .svg/.xml, or launch normally for the full
            converter).
          files: desktop/target/wix/*.msi
          fail_on_unmatched_files: true

      - name: Upload release (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}-${{ matrix.label }}
          name: "Watermelon Vector Converter ${{ steps.version.outputs.version }} Desktop (${{ matrix.label }})"
          body: |
            ## Watermelon Vector Converter Desktop (${{ matrix.label }})

            Native build — no WebKitGTK dependency. Includes both the
            converter and the viewer.
          files: desktop/target/debian/*.deb
          fail_on_unmatched_files: true

      - name: Upload release (macOS)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}-${{ matrix.label }}
          name: "Watermelon Vector Converter ${{ steps.version.outputs.version }} Desktop (${{ matrix.label }})"
          body: |
            ## Watermelon Vector Converter Desktop (${{ matrix.label }})

            Native build. No installer yet for macOS — plain executable;
            run `chmod +x` if needed, then launch directly.
          files: desktop/target/package/*
          fail_on_unmatched_files: true
